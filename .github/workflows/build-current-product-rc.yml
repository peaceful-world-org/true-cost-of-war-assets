name: Build current-product release candidate

on:
  push:
    branches:
      - rc/current-product-2026-09-20
    paths:
      - '.github/workflows/build-current-product-rc.yml'

permissions:
  contents: write

concurrency:
  group: true-cost-of-war-current-product-rc
  cancel-in-progress: true

jobs:
  publish-test-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SOURCE_COMMIT: 8b4f8e207cdef84a3958953fb37954a7c3816283
      RC_RELEASE: rc-2026-09-20-current-product-d
      PRODUCT_ORIGIN: https://peaceful-world-org.github.io
      PRODUCT_BASE: https://peaceful-world-org.github.io/true-cost-of-war

    steps:
      - name: Check out public assets repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build isolated EN/RU RC loaders
        shell: bash
        run: |
          set -euo pipefail
          out="releases/${RC_RELEASE}"
          rm -rf "$out"
          mkdir -p "$out"

          python - <<'PY'
          from pathlib import Path
          import os

          release = os.environ["RC_RELEASE"]
          origin = os.environ["PRODUCT_ORIGIN"]
          product_base = os.environ["PRODUCT_BASE"]

          template = r"""(()=>{
            const current=document.currentScript;
            const lang=current?.dataset?.lang||'en';
            if(!['en','ru'].includes(lang)) throw new Error('Current-product RC supports EN/RU only');

            const overviewSrc=__OVERVIEW__;
            const detailsSrc=__DETAILS__;

            const iframe=document.createElement('iframe');
            iframe.id='pw-tcow-current-product-rc';
            iframe.dataset.pwTcowRc=lang;
            iframe.dataset.pwSourceCommit=__COMMIT__;
            iframe.title=lang==='ru'?'Истинная цена войны — релиз-кандидат':'The True Cost of War — release candidate';
            iframe.loading='eager';
            iframe.scrolling='no';
            Object.assign(iframe.style,{
              width:'100%',
              border:'0',
              borderRadius:'0',
              overflow:'hidden',
              minHeight:'500px',
              background:'transparent',
              display:'block'
            });

            const chromeStyle=document.createElement('style');
            chromeStyle.id='pw-tcow-parent-view-switch-style';
            chromeStyle.textContent=`
              #pw-tcow-parent-view-switch{
                position:fixed;top:50%;right:-48px;z-index:999999;
                display:flex;align-items:center;gap:2px;padding:3px;
                border:1px solid rgba(201,196,184,.86);border-radius:999px;
                background:rgba(255,254,251,.94);box-shadow:0 6px 20px rgba(24,26,23,.09);
                backdrop-filter:blur(12px);opacity:0;pointer-events:none;
                transform:translateY(-50%) rotate(90deg) scale(.97);
                transform-origin:center;transition:opacity .16s ease,transform .16s ease,box-shadow .16s ease;
              }
              #pw-tcow-parent-view-switch.is-visible{
                opacity:1;pointer-events:auto;transform:translateY(-50%) rotate(90deg) scale(1);
              }
              #pw-tcow-parent-view-switch button{
                min-width:72px;min-height:30px;padding:6px 10px;border:0;border-radius:999px;
                background:transparent;color:#505149;font:750 11px/1.2 Inter,system-ui,sans-serif;
                cursor:pointer;white-space:nowrap;
              }
              #pw-tcow-parent-view-switch button[aria-pressed="true"]{background:#1f231f;color:#fff}
              #pw-tcow-parent-view-switch button:hover{background:#eeece5;color:#181a17}
              #pw-tcow-parent-view-switch button[aria-pressed="true"]:hover{background:#1f231f;color:#fff}
              @media(max-width:980px){
                #pw-tcow-parent-view-switch{top:auto;right:auto;left:50%;
                  bottom:calc(12px + env(safe-area-inset-bottom,0px));
                  max-width:calc(100vw - 20px);
                  transform:translate(-50%,10px) scale(.98)}
                #pw-tcow-parent-view-switch.is-visible{transform:translate(-50%,0) scale(1)}
                #pw-tcow-parent-view-switch button{min-width:82px;font-size:11px}
              }
              @media(prefers-reduced-motion:reduce){#pw-tcow-parent-view-switch{transition:none}}
            `;
            document.head.appendChild(chromeStyle);

            const viewSwitch=document.createElement('nav');
            viewSwitch.id='pw-tcow-parent-view-switch';
            viewSwitch.dataset.pwViewSwitch='true';
            viewSwitch.setAttribute('aria-label',lang==='ru'?'Режим просмотра':'View mode');

            function makeViewButton(view,label){
              const button=document.createElement('button');
              button.type='button';
              button.dataset.view=view;
              button.textContent=label;
              button.addEventListener('click',()=>{
                setActiveView(view);
                iframe.src=view==='details'?detailsSrc:overviewSrc;
              });
              viewSwitch.appendChild(button);
              return button;
            }

            const overviewButton=makeViewButton('overview',lang==='ru'?'Обзор':'Overview');
            const detailsButton=makeViewButton('details',lang==='ru'?'Подробнее':'Details');

            function setActiveView(view){
              const normalized=view==='details'?'details':'overview';
              viewSwitch.dataset.pwActiveView=normalized;
              overviewButton.setAttribute('aria-pressed',String(normalized==='overview'));
              detailsButton.setAttribute('aria-pressed',String(normalized==='details'));
            }
            setActiveView('overview');

            function syncFloatingVisibility(){
              const rect=iframe.getBoundingClientRect();
              const passedTop=rect.top < -110;
              const overlapsViewport=rect.bottom > 120 && rect.top < (window.innerHeight-80);
              const visible=passedTop && overlapsViewport;
              viewSwitch.classList.toggle('is-visible',visible);
              viewSwitch.dataset.pwFloatingVisible=String(visible);
            }

            window.addEventListener('scroll',syncFloatingVisibility,{passive:true});
            window.addEventListener('resize',syncFloatingVisibility,{passive:true});

            function onMessage(event){
              if(event.origin!==__ORIGIN__) return;
              iframe.dataset.pwMessageOrigin='matched';
              iframe.dataset.pwMessageType=String(event.data?.type||'unknown');
              if(event.source!==iframe.contentWindow){
                iframe.dataset.pwMessageSource='mismatch';
                return;
              }
              iframe.dataset.pwMessageSource='matched';
              if(event.data?.type==='pw2-view'){
                setActiveView(event.data.view);
                return;
              }
              if(event.data?.type!=='pw2-resize') return;
              const height=Number(event.data.height);
              if(!Number.isFinite(height)||height<100){
                iframe.dataset.pwResizeStatus='invalid-height';
                return;
              }
              iframe.style.height=Math.ceil(height)+'px';
              iframe.dataset.pwResize=String(Math.ceil(height));
              iframe.dataset.pwResizeStatus='received';
              syncFloatingVisibility();
            }
            window.addEventListener('message',onMessage);

            function requestState(){
              try{
                iframe.contentWindow?.postMessage({type:'pw2-request-resize'},__ORIGIN__);
                iframe.contentWindow?.postMessage({type:'pw2-request-view'},__ORIGIN__);
              }catch(_){}
            }

            iframe.addEventListener('load',()=>{
              iframe.dataset.pwLoad='true';
              requestState();
              setTimeout(requestState,150);
              setTimeout(requestState,600);
              setTimeout(syncFloatingVisibility,0);
            });

            iframe.src=overviewSrc;

            const anchor=current||document.body.lastChild;
            if(anchor?.parentNode) anchor.parentNode.insertBefore(iframe,anchor);
            else document.body.appendChild(iframe);
            document.body.appendChild(viewSwitch);

            syncFloatingVisibility();
            setTimeout(requestState,1200);
            setTimeout(requestState,3000);
            setTimeout(syncFloatingVisibility,300);
          })();
          """

          commit = repr(os.environ["SOURCE_COMMIT"])
          origin_js = repr(origin)
          for lang in ("en", "ru"):
              overview = f"{product_base}/unified/product.html?lang={lang}&embed=1"
              details = f"{product_base}/model-v2-lab/index.html?lang={lang}&embed=1"
              code = (
                  template
                  .replace("__OVERVIEW__", repr(overview))
                  .replace("__DETAILS__", repr(details))
                  .replace("__ORIGIN__", origin_js)
                  .replace("__COMMIT__", commit)
              )
              Path(f"releases/{release}/{lang}-loader.js").write_text(code + "\n", encoding="utf-8")

          Path(f"releases/{release}/CANDIDATE.txt").write_text(
              f"release={release}\n"
              f"sourceCommit={os.environ['SOURCE_COMMIT']}\n"
              f"productBase={product_base}\n"
              "status=release-candidate-not-production\n"
              "languages=en,ru\n"
              "productionManifestChanged=no\n",
              encoding="utf-8",
          )
          PY

          test -s "$out/en-loader.js"
          test -s "$out/ru-loader.js"

      - name: Commit and tag RC without changing production manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "releases/${RC_RELEASE}"
          git commit -m "Publish current-product integration RC ${RC_RELEASE}"
          git tag -f "${RC_RELEASE}"
          git push origin HEAD:rc/current-product-2026-09-20
          git push origin "refs/tags/${RC_RELEASE}" --force

      - name: Wait for immutable jsDelivr RC loaders
        shell: bash
        run: |
          set -euo pipefail
          base="https://cdn.jsdelivr.net/gh/peaceful-world-org/true-cost-of-war-assets@${RC_RELEASE}/releases/${RC_RELEASE}"
          for path in ru-loader.js en-loader.js; do
            echo "Checking $path"
            ok=0
            for attempt in {1..15}; do
              if curl --fail --location --silent --show-error --max-time 20 "$base/$path" -o /tmp/asset; then
                test "$(wc -c < /tmp/asset)" -gt 500
                ok=1
                break
              fi
              sleep 4
            done
            test "$ok" -eq 1
          done

      - name: Verify reviewed GitHub Pages product is live
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"

          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --hide-scrollbars --window-size=390,1000 \
            --virtual-time-budget=9000 --dump-dom \
            "${PRODUCT_BASE}/unified/product.html?lang=ru&embed=1" > /tmp/ru.dom
          grep -q 'pw-product-overview' /tmp/ru.dom
          grep -q 'Экономические потери' /tmp/ru.dom
          grep -q 'data-product-floating-switch' /tmp/ru.dom

          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --hide-scrollbars --window-size=1280,1000 \
            --virtual-time-budget=9000 --dump-dom \
            "${PRODUCT_BASE}/unified/product.html?lang=en&embed=1" > /tmp/en.dom
          grep -q 'pw-product-overview' /tmp/en.dom
          grep -q 'Economic losses' /tmp/en.dom
          grep -q 'data-product-floating-switch' /tmp/en.dom

      - name: Tilda-like cross-origin resize smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://cdn.jsdelivr.net/gh/peaceful-world-org/true-cost-of-war-assets@${RC_RELEASE}/releases/${RC_RELEASE}"
          cat > /tmp/tilda-host.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
          <body>
            <div id="tilda-shell-sentinel" style="height:140px">Tilda shell sentinel</div>
            <script data-lang="ru" src="$base/ru-loader.js"></script>
            <script>
              setTimeout(()=>window.scrollTo(0,1200),5000);
              setTimeout(()=>document.querySelector('#pw-tcow-parent-view-switch button[data-view="details"]')?.click(),7500);
            </script>
          </body></html>
          HTML

          python -m http.server 8765 --directory /tmp >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --hide-scrollbars --window-size=390,1000 \
            --virtual-time-budget=16000 --dump-dom \
            http://127.0.0.1:8765/tilda-host.html > /tmp/tilda.dom

          echo "---- rendered iframe ----"
          grep -o '<iframe[^>]*id="pw-tcow-current-product-rc"[^>]*>' /tmp/tilda.dom || true
          echo "---- assertions ----"
          grep -q 'tilda-shell-sentinel' /tmp/tilda.dom && echo 'PASS host sentinel'
          grep -q 'pw-tcow-current-product-rc' /tmp/tilda.dom && echo 'PASS iframe inserted'
          grep -q 'data-pw-tcow-rc="ru"' /tmp/tilda.dom && echo 'PASS language marker'
          grep -q 'data-pw-load="true"' /tmp/tilda.dom && echo 'PASS iframe load event'
          grep -q 'data-pw-message-origin="matched"' /tmp/tilda.dom && echo 'PASS child message origin'
          grep -q 'data-pw-message-source="matched"' /tmp/tilda.dom && echo 'PASS child message source'
          grep -q 'data-pw-resize-status="received"' /tmp/tilda.dom && echo 'PASS resize message'
          grep -q 'data-pw-resize=' /tmp/tilda.dom && echo 'PASS resize height'
          grep -q 'id="pw-tcow-parent-view-switch"' /tmp/tilda.dom && echo 'PASS parent view switch inserted'
          grep -q 'data-pw-floating-visible="true"' /tmp/tilda.dom && echo 'PASS parent view switch follows parent scroll'
          grep -q 'data-pw-active-view="details"' /tmp/tilda.dom && echo 'PASS active view synced after navigation'
          grep -q 'model-v2-lab/index.html?lang=ru&amp;embed=1' /tmp/tilda.dom && echo 'PASS parent view switch opened Details'

          echo "PASS: RC loader preserves host shell, auto-resize and parent-level Overview/Details navigation"
