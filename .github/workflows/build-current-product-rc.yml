name: Build current-product release candidate

on:
  push:
    branches:
      - rc/current-product-2026-09-20
    paths:
      - '.github/workflows/build-current-product-rc.yml'

permissions:
  contents: write

concurrency:
  group: true-cost-of-war-current-product-rc
  cancel-in-progress: true

jobs:
  build-publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SOURCE_COMMIT: c711ef8b36d0d121efd45f73c7591306917ec34f
      RC_RELEASE: rc-2026-09-20-current-product-a

    steps:
      - name: Check out public assets repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out reviewed source commit
        uses: actions/checkout@v4
        with:
          repository: peaceful-world-org/true-cost-of-war
          ref: ${{ env.SOURCE_COMMIT }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and browser-test reviewed widget bundle
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python scripts/build_widget_bundle.py
          python scripts/browser_smoke_widget_bundle.py

      - name: Assemble immutable RC delivery package
        shell: bash
        run: |
          set -euo pipefail
          out="releases/${RC_RELEASE}"
          rm -rf "$out"
          mkdir -p "$out/widget"
          cp -R source/dist/true-cost-of-war/. "$out/widget/"

          python - <<'PY'
          from pathlib import Path
          import os

          release = os.environ["RC_RELEASE"]
          base = (
              "https://cdn.jsdelivr.net/gh/peaceful-world-org/"
              f"true-cost-of-war-assets@{release}/releases/{release}"
          )

          template = r"""(()=>{
            const current=document.currentScript;
            const lang=current?.dataset?.lang||'en';
            if(!['en','ru'].includes(lang)) throw new Error('Current-product RC supports EN/RU only');

            const iframe=document.createElement('iframe');
            iframe.id='pw-tcow-current-product-rc';
            iframe.dataset.pwTcowRc=lang;
            iframe.src=__SRC__;
            iframe.title=lang==='ru'?'Истинная цена войны — релиз-кандидат':'The True Cost of War — release candidate';
            iframe.loading='eager';
            iframe.scrolling='no';
            iframe.setAttribute('allow','clipboard-write');
            Object.assign(iframe.style,{
              width:'100%',
              border:'0',
              borderRadius:'0',
              overflow:'hidden',
              minHeight:'500px',
              background:'transparent',
              display:'block'
            });

            const anchor=current||document.body.lastChild;
            if(anchor?.parentNode) anchor.parentNode.insertBefore(iframe,anchor);
            else document.body.appendChild(iframe);

            function onMessage(event){
              if(event.origin!=='https://cdn.jsdelivr.net') return;
              if(event.source!==iframe.contentWindow) return;
              if(event.data?.type!=='pw2-resize') return;
              const height=Number(event.data.height);
              if(!Number.isFinite(height)||height<100) return;
              iframe.style.height=Math.ceil(height)+'px';
              iframe.dataset.pwResize=String(Math.ceil(height));
            }
            window.addEventListener('message',onMessage);

            iframe.addEventListener('load',()=>{
              try{
                iframe.contentWindow?.postMessage({type:'pw2-request-resize'},'https://cdn.jsdelivr.net');
              }catch(_){}
            });
          })();
          """

          for lang, route in (("en", "index.html"), ("ru", "ru/index.html")):
              src = f"{base}/widget/{route}?embed=1"
              code = template.replace("__SRC__", repr(src))
              Path(f"releases/{release}/{lang}-loader.js").write_text(code + "\n", encoding="utf-8")

          Path(f"releases/{release}/CANDIDATE.txt").write_text(
              f"release={release}\nsourceCommit={os.environ['SOURCE_COMMIT']}\n"
              "status=release-candidate-not-production\n"
              "languages=en,ru\n",
              encoding="utf-8",
          )
          PY

          test -s "$out/en-loader.js"
          test -s "$out/ru-loader.js"
          test -s "$out/widget/unified/product.html"
          test -s "$out/widget/model-v2-lab/index.html"

      - name: Commit and tag RC without changing production manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "releases/${RC_RELEASE}"
          git commit -m "Publish current-product release candidate ${RC_RELEASE}"
          git tag -f "${RC_RELEASE}"
          git push origin HEAD:rc/current-product-2026-09-20
          git push origin "refs/tags/${RC_RELEASE}" --force

      - name: Wait for immutable jsDelivr RC
        shell: bash
        run: |
          set -euo pipefail
          base="https://cdn.jsdelivr.net/gh/peaceful-world-org/true-cost-of-war-assets@${RC_RELEASE}/releases/${RC_RELEASE}"
          for path in ru-loader.js en-loader.js widget/ru/index.html widget/unified/product.html widget/model-v2-lab/index.html; do
            echo "Checking $path"
            ok=0
            for attempt in {1..15}; do
              if curl --fail --location --silent --show-error --max-time 20 "$base/$path" -o /tmp/asset; then
                test "$(wc -c < /tmp/asset)" -gt 100
                ok=1
                break
              fi
              sleep 4
            done
            test "$ok" -eq 1
          done

      - name: Real-browser smoke immutable CDN product
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          base="https://cdn.jsdelivr.net/gh/peaceful-world-org/true-cost-of-war-assets@${RC_RELEASE}/releases/${RC_RELEASE}"

          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --hide-scrollbars --window-size=390,1000 \
            --virtual-time-budget=9000 --dump-dom \
            "$base/widget/ru/index.html?embed=1" > /tmp/ru.dom
          grep -q 'pw-product-overview' /tmp/ru.dom
          grep -q 'Экономические потери' /tmp/ru.dom
          grep -q 'data-product-floating-switch' /tmp/ru.dom

          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --hide-scrollbars --window-size=1280,1000 \
            --virtual-time-budget=9000 --dump-dom \
            "$base/widget/index.html?embed=1" > /tmp/en.dom
          grep -q 'pw-product-overview' /tmp/en.dom
          grep -q 'Economic losses' /tmp/en.dom
          grep -q 'data-product-floating-switch' /tmp/en.dom

      - name: Tilda-like cross-origin resize smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://cdn.jsdelivr.net/gh/peaceful-world-org/true-cost-of-war-assets@${RC_RELEASE}/releases/${RC_RELEASE}"
          cat > /tmp/tilda-host.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
          <body>
            <div id="tilda-shell-sentinel">Tilda shell sentinel</div>
            <script data-lang="ru" src="$base/ru-loader.js"></script>
          </body></html>
          HTML

          python -m http.server 8765 --directory /tmp >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --hide-scrollbars --window-size=390,1000 \
            --virtual-time-budget=12000 --dump-dom \
            http://127.0.0.1:8765/tilda-host.html > /tmp/tilda.dom

          grep -q 'tilda-shell-sentinel' /tmp/tilda.dom
          grep -q 'pw-tcow-current-product-rc' /tmp/tilda.dom
          grep -q 'data-pw-tcow-rc="ru"' /tmp/tilda.dom
          grep -q 'data-pw-resize=' /tmp/tilda.dom

          echo "PASS: immutable RC loader renders current RU product and receives cross-origin resize"
